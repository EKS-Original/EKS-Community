<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKS Member Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 350px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .success {
            color: #22c55e;
            background: #064e3b;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #059669;
        }
        .error {
            color: #ef4444;
            background: #7f1d1d;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #dc2626;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>EKS Original</h2>
        <p>Enter your unique EKS Member Code</p>
        <input type="text" id="memberCode" placeholder="EKS-XXXXX">
        <button onclick="verifyCode()">Verify Code</button>
        <div id="result"></div>
    </div>

    <script>
        // သင့်ရဲ့ Member Codes များကို ဒီထဲမှာ ထည့်ပေးပါ
        const validCodes = ["EKS-12345", "EKS-99999", "EKS-77777", "EKS-2026A"];

        function verifyCode() {
            const input = document.getElementById('memberCode').value.trim();
            const resultDiv = document.getElementById('result');

            if (input === "") {
                resultDiv.innerHTML = "<div class='error'>ကျေးဇူးပြု၍ Code ထည့်ပါ</div>";
                return;
            }

            if (validCodes.includes(input)) {
                resultDiv.innerHTML = "<div class='success'>🎉 You are EKS Member!</div>";
            } else {
                resultDiv.innerHTML = "<div class='error'>❌ Invalid Code! မှားယွင်းနေပါသည်။</div>";
            }
        }
    </script>
</body>
</html>
